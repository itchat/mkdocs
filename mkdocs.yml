# 导航由 mkdocs-awesome-nav 根据 docs/ 目录结构自动生成，
# 顺序和显示名见各目录下的 .nav.yml，这里不需要再手动维护 nav。

theme:
  name: material
  # custom_dir: overrides
  favicon: resources/icon.svg
  logo: resources/logo.svg
  font: 
    code: JetBrains Mono

  language: zh
  features:
    - navigation.instant # 启用即时导航，提高页面切换速度
    - navigation.instant.prefetch # 预取链接，进一步提升性能
    - navigation.instant.progress # 显示加载进度
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    # - navigation.expand
    - navigation.top
    - navigation.footer # display prev/next links
    - content.code.annotate
    - content.code.copy
  
  palette:
    - scheme: default
      primary: blue grey
      
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode

    - scheme: slate
      primary: blue grey
      
      toggle:
        icon: material/weather-night
        name: Switch to light mode



markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  # - meta
  - pymdownx.details
  - pymdownx.snippets
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.arithmatex:
      generic: true
  - tables
  - toc
  - mdx_truly_sane_lists:
      nested_indent: 4

plugins:
  - awesome-nav
  - tags
  - search:
      separator: '[\s\-\.,;:\(\)\[\]{}\/\\]+' # 改进搜索分词，支持更多分隔符
      lang: zh
  - minify: # 启用压缩
      minify_html: true
      minify_css: true
      minify_js: true
      cache_safe: true # 给自定义 css/js 的 URL 加内容哈希，便于长期缓存
      htmlmin_opts:
        remove_comments: true
        remove_empty_space: true
      css_files:
        - resources/lxgw-wenkai-lite.css
        - resources/extra.css
      js_files:
        - resources/katex.js

# search_index_only: false

# 构建优化
strict: true # 严格模式，确保所有链接有效
use_directory_urls: true # 使用目录风格的 URL

# 性能优化
